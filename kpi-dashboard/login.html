<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — HERMES Agent Control Center</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #16233f 0%, #0a0f1e 55%, #060a14 100%);
    color: #e8edf7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: rgba(17, 26, 47, 0.92);
    border: 1px solid #24365c;
    border-radius: 14px;
    padding: 36px 32px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }
  .logo {
    text-align: center;
    margin-bottom: 8px;
    font-size: 15px;
    letter-spacing: 4px;
    color: #7d8db0;
    font-weight: 600;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 6px;
    color: #fff;
  }
  .sub {
    text-align: center;
    font-size: 13px;
    color: #8b9bbd;
    margin-bottom: 26px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #9fb0d0;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #2c3f68;
    background: #0b1226;
    color: #e8edf7;
    font-size: 15px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #4f7cff; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #3b6cff, #2547c4);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .err {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(255, 77, 79, 0.12);
    border: 1px solid rgba(255, 77, 79, 0.4);
    color: #ff9a9b;
    font-size: 13px;
    text-align: center;
  }
  .foot {
    margin-top: 22px;
    text-align: center;
    font-size: 11px;
    color: #5b6b8f;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">HERMES</div>
    <h1>Agent Control Center</h1>
    <div class="sub">Masuk untuk membuka dashboard</div>
    <form id="f">
      <label for="token">DASH TOKEN</label>
      <input type="password" id="token" name="token" placeholder="Tempel token dashboard" autocomplete="current-password" required autofocus>
      <button type="submit" id="btn">Masuk</button>
      <div class="err" id="err"></div>
    </form>
    <div class="foot">Akses terbatas — hubungi admin untuk token</div>
  </div>
<script>
  const f = document.getElementById('f');
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Memeriksa...';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: document.getElementById('token').value })
      });
      const j = await r.json();
      if (r.ok && j.success) {
        location.href = '/';
      } else {
        err.textContent = j.error || 'Login gagal';
        err.style.display = 'block';
      }
    } catch (ex) {
      err.textContent = 'Tidak bisa menghubungi server';
      err.style.display = 'block';
    }
    btn.disabled = false;
    btn.textContent = 'Masuk';
  });
</script>
</body>
</html>
